<body>

    <div class="ui-layer">

                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>

                <button class="mode-btn" data-mode="idle">IDLE</button>
            </div>
        </footer>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. CONFIGURATION & STATE ---
        const STATES = {
            listening: {
                name: 'LISTENING',
                primaryColor: new THREE.Color('#00f0ff'),
                secondaryColor: new THREE.Color('#7000ff'),
                coreColor: new THREE.Color('#0077ff'),
                speed: 1.8,
                roughness: 0.45,
                particleSpeed: 0.008,
                pulseRate: 1.5,
                hint: '"Listening to voice input..."'
            },
            processing: {
                name: 'THINKING',
                primaryColor: new THREE.Color('#ffaa00'),
                secondaryColor: new THREE.Color('#ff0055'),
                coreColor: new THREE.Color('#990033'),
                speed: 3.8,
                roughness: 0.8,
                particleSpeed: 0.025,
                pulseRate: 3.5,
                hint: '"Analyzing semantic neural intent..."'
            },
            speaking: {
                name: 'SPEAKING',
                primaryColor: new THREE.Color('#00ffa3'),
                secondaryColor: new THREE.Color('#0066ff'),
                coreColor: new THREE.Color('#0033aa'),
                speed: 2.2,
                roughness: 0.6,
                particleSpeed: 0.012,
                pulseRate: 2.2,
                hint: '"Broadcasting synthesized voice stream..."'
            },
            idle: {
                name: 'STANDBY',
                primaryColor: new THREE.Color('#446688'),
                secondaryColor: new THREE.Color('#1a223a'),
                coreColor: new THREE.Color('#0b101b'),
                speed: 0.6,
                roughness: 0.15,
                particleSpeed: 0.002,
                pulseRate: 0.6,
                hint: '"Standing by. Say \'Aetheria\' or click mic."'
            }
        };

        let currentMode = 'listening';
        let targetMode = 'listening';
        let audioSensitivity = 1.5;
        let isRealMicActive = false;
        let audioContext, analyser, dataArray, micStream;

        // Visual lerp colors
        const currentColor1 = STATES.listening.primaryColor.clone();
        const currentColor2 = STATES.listening.secondaryColor.clone();
        const currentCoreColor = STATES.listening.coreColor.clone();
        let currentSpeed = STATES.listening.speed;
        let currentRoughness = STATES.listening.roughness;

        // UI Equalizer Bars Init
        const eqContainer = document.getElementById('eq-bars');
        const numEqBars = 24;
        const eqBarElements = [];
        for (let i = 0; i < numEqBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            eqContainer.appendChild(bar);
            eqBarElements.push(bar);
        }

        // --- 2. THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030308, 0.035);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 7.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // --- 3. CUSTOM SHADER DISPLACEMENT CORE ORB ---
        const noiseShaderSnippet = `
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            vec3 fade(vec3 t) {return t*t*t*(t*(t*6.0-15.0)+10.0);}

            float cnoise(vec3 P){
                vec3 Pi0 = floor(P);
                vec3 Pi1 = Pi0 + vec3(1.0);
                Pi0 = mod(Pi0, 289.0);
                Pi1 = mod(Pi1, 289.0);
                vec3 Pf0 = fract(P);
                vec3 Pf1 = Pf0 - vec3(1.0);
                vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
                vec4 iy = vec4(Pi0.yy, Pi1.yy);
                vec4 iz0 = Pi0.zzzz;
                vec4 iz1 = Pi1.zzzz;

                vec4 ixy = permute(permute(ix) + iy);
                vec4 ixy0 = permute(ixy + iz0);
                vec4 ixy1 = permute(ixy + iz1);

                vec4 gx0 = ixy0 / 7.0;
                vec4 gy0 = fract(floor(gx0) / 7.0) - 0.5;
                gx0 = fract(gx0);
                vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
                vec4 sz0 = step(gz0, vec4(0.0));
                gx0 -= sz0 * (step(0.0, gx0) - 0.5);
                gy0 -= sz0 * (step(0.0, gy0) - 0.5);

                vec4 gx1 = ixy1 / 7.0;
                vec4 gy1 = fract(floor(gx1) / 7.0) - 0.5;
                gx1 = fract(gx1);
                vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
                vec4 sz1 = step(gz1, vec4(0.0));
                gx1 -= sz1 * (step(0.0, gx1) - 0.5);
                gy1 -= sz1 * (step(0.0, gy1) - 0.5);

                vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
                vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
                vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
                vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
                vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
                vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
                vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
                vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);

                vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
                g000 *= norm0.x;
                g010 *= norm0.y;
                g100 *= norm0.z;
                g110 *= norm0.w;
                vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
                g001 *= norm1.x;
                g011 *= norm1.y;
                g101 *= norm1.z;
                g111 *= norm1.w;

                float n000 = dot(g000, Pf0);
                float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
                float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
                float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
                float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
                float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
                float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
                float n111 = dot(g111, Pf1);

                vec3 fade_xyz = fade(Pf0);
                vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
                vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
                float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x);
                return 2.2 * n_xyz;
            }
        `;

        const sphereGeometry = new THREE.SphereGeometry(1.8, 128, 128);
        const orbUniforms = {
            uTime: { value: 0 },
            uAudioStrength: { value: 0.0 },
            uPrimaryColor: { value: currentColor1 },
            uSecondaryColor: { value: currentColor2 },
            uCoreColor: { value: currentCoreColor },
            uDisplacement: { value: 0.5 },
            uNoiseScale: { value: 1.2 }
        };

        const orbMaterial = new THREE.ShaderMaterial({
            uniforms: orbUniforms,
            vertexShader: `
                ${noiseShaderSnippet}
                uniform float uTime;
                uniform float uAudioStrength;
                uniform float uDisplacement;
                uniform float uNoiseScale;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vElevation;

                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    
                    float lowFreq = cnoise(position * uNoiseScale + vec3(uTime * 0.4));
                    float highFreq = cnoise(position * (uNoiseScale * 2.5) + vec3(uTime * 0.8)) * 0.35;
                    
                    float displacement = (lowFreq + highFreq) * (uDisplacement + uAudioStrength * 0.85);
                    vElevation = displacement;
                    
                    vec3 newPosition = position + normal * displacement;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uPrimaryColor;
                uniform vec3 uSecondaryColor;
                uniform vec3 uCoreColor;
                uniform float uTime;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vElevation;

                void main() {
                    // Fresnel calculation
                    vec3 viewDir = normalize(-vPosition);
                    float fresnel = pow(1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 2.5);
                    
                    // Complex dynamic color blending based on elevation & time
                    vec3 colorMix = mix(uCoreColor, uSecondaryColor, clamp(vElevation + 0.5, 0.0, 1.0));
                    colorMix = mix(colorMix, uPrimaryColor, fresnel * 1.2);
                    
                    // Wireframe-like energetic lines
                    float scanline = sin((vPosition.y + vElevation) * 35.0 + uTime * 3.0);
                    if(scanline > 0.88) {
                        colorMix += uPrimaryColor * 0.35;
                    }

                    gl_FragColor = vec4(colorMix + vec3(fresnel * 0.4), 0.88);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            wireframe: false
        });

        const orbMesh = new THREE.Mesh(sphereGeometry, orbMaterial);
        scene.add(orbMesh);

        // Core Inner Glowing Orb
        const innerGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.35,
            blending: THREE.AdditiveBlending
        });
        const innerOrb = new THREE.Mesh(innerGeo, innerMat);
        orbMesh.add(innerOrb);

        // --- 4. FLOATING DATA NODES & NEURAL ORBIT PARTICLES ---
        const particleCount = 2000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleScales = new Float32Array(particleCount);
        const particleVelocities = [];

        for (let i = 0; i < particleCount; i++) {
            const radius = 2.4 + Math.random() * 3.2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(Math.random() * 2 - 1);

            particlePositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            particlePositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            particlePositions[i * 3 + 2] = radius * Math.cos(phi);

            particleScales[i] = Math.random() * 0.8 + 0.2;
            particleVelocities.push({
                x: (Math.random() - 0.5) * 0.005,
                y: (Math.random() - 0.5) * 0.005,
                z: (Math.random() - 0.5) * 0.005,
                speed: Math.random() * 0.02 + 0.005
            });
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('scale', new THREE.BufferAttribute(particleScales, 1));

        const particleShaderMat = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: currentColor1 },
                uTime: { value: 0 }
            },
            vertexShader: `
                attribute float scale;
                uniform float uTime;
                varying float vAlpha;

                void main() {
                    vec3 p = position;
                    vAlpha = scale;
                    vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
                    gl_PointSize = scale * (18.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vAlpha;

                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float glow = 1.0 - smoothstep(0.0, 0.5, dist);
                    gl_FragColor = vec4(uColor, glow * vAlpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(particleGeo, particleShaderMat);
        scene.add(particleSystem);

        // --- 5. HOLOGRAPHIC EQUATORIAL RINGS ---
        const ringGroup = new THREE.Group();
        const createEquatorRing = (radius, count, color) => {
            const ringGeo = new THREE.BufferGeometry();
            const ringPos = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                ringPos[i * 3] = Math.cos(angle) * radius;
                ringPos[i * 3 + 1] = 0;
                ringPos[i * 3 + 2] = Math.sin(angle) * radius;
            }
            ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
            const ringMat = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });
            return new THREE.LineLoop(ringGeo, ringMat);
        };

        const ring1 = createEquatorRing(2.7, 180, 0x00f0ff);
        const ring2 = createEquatorRing(3.2, 220, 0x7000ff);
        const ring3 = createEquatorRing(3.8, 260, 0x00ffa3);
        ring2.rotation.x = 0.4;
        ring3.rotation.z = -0.35;
        ring3.rotation.x = 0.2;

        ringGroup.add(ring1);
        ringGroup.add(ring2);
        ringGroup.add(ring3);
        scene.add(ringGroup);

        // Ambient Lights for depth
        const light1 = new THREE.PointLight(0x00f0ff, 2, 50);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x7000ff, 2, 50);
        light2.position.set(-5, -5, 5);
        scene.add(light2);

        // --- 6. AUDIO & SYNTHESIS LOGIC ---
        let syntheticFreqData = new Uint8Array(numEqBars);
        let audioLevel = 0.0;
        let smoothAudioLevel = 0.0;

        async function initMicrophone() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 128;
                analyser.smoothingTimeConstant = 0.8;
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                micStream = stream;
                isRealMicActive = true;
                document.getElementById('mic-btn').style.background = 'radial-gradient(circle at 30% 30%, #00ffa3, #0066ff)';
                document.getElementById('transcript-hint').innerText = '"Mic connected! Speak to animate neural core."';
            } catch (err) {
                console.warn("Microphone access denied or unsupported, using procedural voice synth.", err);
                isRealMicActive = false;
                document.getElementById('transcript-hint').innerText = '"Simulating voice activity (Click mic to retry live)"';
            }
        }

        function toggleMic() {
            if (!isRealMicActive) {
                initMicrophone();
            } else {
                if (micStream) {
                    micStream.getTracks().forEach(track => track.stop());
                }
                isRealMicActive = false;
                document.getElementById('mic-btn').style.background = 'radial-gradient(circle at 30% 30%, #00f0ff, #7000ff)';
                document.getElementById('transcript-hint').innerText = '"Simulated voice mode active."';
            }
        }

        document.getElementById('mic-btn').addEventListener('click', toggleMic);

        // --- 7. INTERACTION & MODE SWITCHING ---
        const modeButtons = document.querySelectorAll('.mode-btn');
        const modeText = document.getElementById('mode-text');
        const hudStatus = document.getElementById('hud-status');
        const statusDot = document.getElementById('status-dot');
        const gainSlider = document.getElementById('gain-slider');

        gainSlider.addEventListener('input', (e) => {
            audioSensitivity = parseFloat(e.target.value);
        });

        function setMode(modeKey) {
            if (!STATES[modeKey]) return;
            targetMode = modeKey;
            currentMode = modeKey;

            modeButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === modeKey);
            });

            const state = STATES[modeKey];
            modeText.innerText = state.name;
            hudStatus.innerText = `SYSTEM ${state.name}`;
            document.getElementById('transcript-hint').innerText = state.hint;

            // Update status styles
            const hexColor = '#' + state.primaryColor.getHexString();
            statusDot.style.background = hexColor;
            statusDot.style.boxShadow = `0 0 15px ${hexColor}`;
            hudStatus.style.color = hexColor;
            hudStatus.style.borderColor = `rgba(${state.primaryColor.r * 255}, ${state.primaryColor.g * 255}, ${state.primaryColor.b * 255}, 0.3)`;
            modeText.style.textShadow = `0 0 25px ${hexColor}`;
        }

        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setMode(btn.dataset.mode);
            });
        });

        // Mouse Parallax & Dynamic Drag
        let mouseX = 0, mouseY = 0;
        let targetRotX = 0, targetRotY = 0;
        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = -(e.clientY / window.innerHeight) * 2 + 1;
            mouseX = x;
            mouseY = y;

            if (isDragging) {
                const deltaX = e.clientX - prevMousePos.x;
                const deltaY = e.clientY - prevMousePos.y;
                orbMesh.rotation.y += deltaX * 0.008;
                orbMesh.rotation.x += deltaY * 0.008;
                ringGroup.rotation.y += deltaX * 0.005;
            }
            prevMousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.controls-panel') || e.target.closest('.mode-selector') || e.target.closest('.mic-trigger-btn')) return;
            isDragging = true;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Touch parallax support
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
            }
        }, { passive: true });

        // --- 8. RESIZE LISTENER ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        // --- 9. ANIMATION & RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const targetState = STATES[targetMode];

            // 1. Color Lerping & Parameter Transitions
            currentColor1.lerp(targetState.primaryColor, 0.04);
            currentColor2.lerp(targetState.secondaryColor, 0.04);
            currentCoreColor.lerp(targetState.coreColor, 0.04);
            currentSpeed += (targetState.speed - currentSpeed) * 0.05;
            currentRoughness += (targetState.roughness - currentRoughness) * 0.05;

            // 2. Audio Processing (Real Mic or Synthetic Speech Rhythm)
            if (isRealMicActive && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                audioLevel = (sum / dataArray.length / 255) * audioSensitivity;

                // Sync UI equalizer
                for (let i = 0; i < numEqBars; i++) {
                    const idx = Math.floor(i * (dataArray.length / numEqBars));
                    const val = (dataArray[idx] / 255) * 100 * audioSensitivity;
                    eqBarElements[i].style.height = `${Math.max(4, Math.min(28, val))}px`;
                    eqBarElements[i].style.background = '#' + currentColor1.getHexString();
                }
            } else {
                // Procedural audio pattern based on state
                let baseWave = 0;
                if (targetMode === 'listening') {
                    baseWave = Math.sin(elapsedTime * 3.5) * 0.25 + Math.sin(elapsedTime * 8.2) * 0.15 + Math.cos(elapsedTime * 1.5) * 0.3;
                } else if (targetMode === 'processing') {
                    baseWave = Math.sin(elapsedTime * 12.0) * 0.4 + Math.cos(elapsedTime * 20.0) * 0.2;
                } else if (targetMode === 'speaking') {
                    baseWave = Math.abs(Math.sin(elapsedTime * 5.0)) * 0.6 + Math.sin(elapsedTime * 14.0) * 0.25;
                } else {
                    baseWave = 0.05 + Math.sin(elapsedTime * 0.8) * 0.03; // Idle subtle breathing
                }

                audioLevel = Math.max(0.05, baseWave) * audioSensitivity;

                // Procedural EQ visualizer updates
                for (let i = 0; i < numEqBars; i++) {
                    const noise = Math.sin(elapsedTime * 6.0 + i * 0.4) * 0.5 + 0.5;
                    const barHeight = Math.max(4, audioLevel * noise * 24 + 4);
                    eqBarElements[i].style.height = `${barHeight}px`;
                    eqBarElements[i].style.background = '#' + currentColor1.getHexString();
                }
            }

            smoothAudioLevel += (audioLevel - smoothAudioLevel) * 0.15;

            // 3. Update Shader Uniforms
            orbUniforms.uTime.value = elapsedTime * currentSpeed;
            orbUniforms.uAudioStrength.value = smoothAudioLevel;
            orbUniforms.uDisplacement.value = currentRoughness;
            orbUniforms.uPrimaryColor.value = currentColor1;
            orbUniforms.uSecondaryColor.value = currentColor2;
            orbUniforms.uCoreColor.value = currentCoreColor;

            innerMat.color = currentColor1;
            innerOrb.scale.setScalar(1.0 + smoothAudioLevel * 0.45);

            particleShaderMat.uniforms.uColor.value = currentColor1;
            particleShaderMat.uniforms.uTime.value = elapsedTime;

            // 4. Update Ring Equalizer Modulation
            ring1.material.color = currentColor1;
            ring2.material.color = currentColor2;
            ring3.material.color = currentColor1;

            ring1.rotation.y = elapsedTime * 0.15;
            ring2.rotation.y = -elapsedTime * 0.25;
            ring3.rotation.y = elapsedTime * 0.35;

            const ring1Scale = 1.0 + smoothAudioLevel * 0.25;
            ring1.scale.set(ring1Scale, ring1Scale, ring1Scale);
            const ring2Scale = 1.0 + Math.sin(elapsedTime * 3.0) * 0.05 + smoothAudioLevel * 0.35;
            ring2.scale.set(ring2Scale, ring2Scale, ring2Scale);

            // 5. Update Orbiting Particles
            const posAttr = particleGeo.attributes.position;
            for (let i = 0; i < particleCount; i++) {
                const vel = particleVelocities[i];
                let px = posAttr.getX(i);
                let py = posAttr.getY(i);
                let pz = posAttr.getZ(i);

                // Vortex orbital motion
                const angle = targetState.particleSpeed;
                const cosA = Math.cos(angle);
                const sinA = Math.sin(angle);
                const rx = px * cosA - pz * sinA;
                const rz = px * sinA + pz * cosA;

                px = rx + vel.x;
                py += vel.y + Math.sin(elapsedTime * 2.0 + i) * 0.002;
                pz = rz + vel.z;

                posAttr.setXYZ(i, px, py, pz);
            }
            posAttr.needsUpdate = true;
            particleSystem.rotation.y = elapsedTime * 0.03;

            // 6. Camera Smooth Interpolation & Natural Floating Motion
            if (!isDragging) {
                targetRotY += (mouseX * 0.6 - targetRotY) * 0.04;
                targetRotX += (mouseY * 0.4 - targetRotX) * 0.04;

                camera.position.x = Math.sin(targetRotY) * 7.5;
                camera.position.z = Math.cos(targetRotY) * 7.5;
                camera.position.y = targetRotX * 3.0 + Math.sin(elapsedTime * 0.7) * 0.2;
                camera.lookAt(0, 0, 0);
            }

            // Light Pulsing
            light1.color = currentColor1;
            light2.color = currentColor2;
            light1.intensity = 1.5 + smoothAudioLevel * 3.0;

            renderer.render(scene, camera);
        }

        // Start render loop
        animate();
    </script>
